data:
  # Colab上でのパスに変更してください
  train_csv: /content/birdclef-2026/train.csv
  taxonomy_csv: /content/birdclef-2026/taxonomy.csv
  train_audio_dir: /content/birdclef-2026/train_audio
  sample_submission_csv: /content/birdclef-2026/sample_submission.csv

  sample_rate: 32000
  duration: 5          # seconds (5秒クリップ)
  n_samples: 160000    # 32000 * 5

  # Mel Spectrogram
  n_mels: 128
  n_fft: 1024
  hop_length: 320      # 160000 / 320 = 500 frames
  fmin: 20
  fmax: 16000

  # 学習データフィルタリング
  min_rating: 0.0      # ratingによるフィルタなし（ベースライン）

model:
  name: tf_efficientnet_b0_ns   # ImageNet21k事前学習済み
  pretrained: true
  in_channels: 1
  num_classes: 234

train:
  seed: 42
  n_folds: 5
  train_fold: 0        # 学習に使うfold（0のみ = fold0をvalidationとして使用）

  epochs: 30
  batch_size: 32
  num_workers: 2
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4

  scheduler: cosine
  warmup_epochs: 1

  use_amp: true        # Mixed Precision Training

augmentation:
  use_mixup: true
  mixup_alpha: 0.5
  mixup_prob: 0.5

  gaussian_noise: true
  noise_std: 0.005
  noise_prob: 0.5

  time_shift: true
  time_shift_prob: 0.5

output:
  dir: /content/output/exp001    # Colab上の出力先
  save_top_k: 1                  # best modelのみ保存
